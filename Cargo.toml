[workspace]
resolver = "3"
members = ["crates/terme-core", "crates/terme-ui", "crates/terme"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ntson9p/terme"
authors = ["The terme contributors"]

[workspace.lints.rust]
unsafe_code = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
